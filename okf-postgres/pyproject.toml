[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "okfmem"
version = "0.2.0"
description = "OKF working-memory ⇄ Postgres recall index (enrichment daemon + MCP server)"
requires-python = ">=3.10"
dependencies = [
  "psycopg[binary]>=3.2",   # Postgres driver (bundled libpq)
  "pgvector>=0.3.6",        # vector type adapter for psycopg3
  "httpx>=0.27",            # local Ollama HTTP API
  "python-frontmatter>=1.1",
  "PyYAML>=6.0",
  "mcp>=1.2",               # Model Context Protocol SDK (FastMCP)
]

[project.scripts]
okfmem = "okfmem.cli:main"
okf-memory-mcp = "okfmem.mcp_server:main"

[tool.setuptools]
packages = ["okfmem"]

<!DOCTYPE html>
<!--
  okf-postgres dashboard — generated by okf-dashboard.sh. Do not edit this output;
  edit dashboard/template.html (this is the page shell) and dashboard/card.html.
  {{TOKENS}} are filled by the shell template compiler. Style freely — it's yours.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- The browser re-pulls this file every {{REFRESH}}s; the shell rewrites it. -->
  <meta http-equiv="refresh" content="{{REFRESH}}">
  <title>okf · {{PROJECT}}</title>
  <style>
    :root {
      --bg: #0e1116; --panel: #161b22; --line: #232b36; --ink: #e6edf3;
      --dim: #8b949e; --accent: #58a6ff; --fresh: #3fb950; --stale: #d29922;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font: 14px/1.5 ui-sans-serif, -apple-system, "SF Pro Text", Segoe UI, sans-serif;
    }
    code, .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
    header.top {
      position: sticky; top: 0; z-index: 5; background: rgba(14,17,22,.85);
      backdrop-filter: blur(8px); border-bottom: 1px solid var(--line);
      padding: 16px 24px; display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
    }
    header.top h1 { margin: 0; font-size: 18px; font-weight: 650; letter-spacing: -.01em; }
    header.top h1 .glyph { color: var(--accent); }
    .db { color: var(--dim); }
    .pills { margin-left: auto; display: flex; gap: 8px; align-items: center; }
    .pill {
      border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px;
      font-size: 12px; color: var(--dim); background: var(--panel);
    }
    .pill b { color: var(--ink); font-weight: 650; }
    .pill.stale b { color: var(--stale); }
    main { padding: 24px; }
    .grid {
      display: grid; gap: 14px;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    }
    .card {
      background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
      padding: 14px 16px; display: flex; flex-direction: column; gap: 8px;
    }
    .card.stale { border-color: color-mix(in srgb, var(--stale) 55%, var(--line)); }
    .card .head { display: flex; align-items: center; gap: 8px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--fresh); flex: none; }
    .card.stale .dot { background: var(--stale); }
    .resource { color: var(--accent); font-size: 12px; word-break: break-all; }
    .badge {
      margin-left: auto; font-size: 11px; text-transform: uppercase; letter-spacing: .04em;
      color: var(--fresh); border: 1px solid color-mix(in srgb, var(--fresh) 40%, transparent);
      border-radius: 6px; padding: 1px 7px;
    }
    .card.stale .badge { color: var(--stale); border-color: color-mix(in srgb, var(--stale) 45%, transparent); }
    .card h2 { margin: 0; font-size: 15px; font-weight: 600; }
    .desc { margin: 0; color: var(--dim); }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { font-size: 11px; color: var(--dim); background: #1f2630; border-radius: 5px; padding: 1px 7px; }
    .foot { display: flex; gap: 14px; color: var(--dim); font-size: 12px; margin-top: 2px; }
    .empty { color: var(--dim); text-align: center; padding: 64px 0; }
    footer.page { color: var(--dim); font-size: 12px; padding: 8px 24px 28px; }
  </style>
</head>
<body>
  <header class="top">
    <h1><span class="glyph">◆</span> {{PROJECT}}</h1>
    <span class="db mono">{{DB}}</span>
    <div class="pills">
      <span class="pill"><b>{{TOTAL}}</b> cards</span>
      <span class="pill stale"><b>{{STALE_COUNT}}</b> stale</span>
      <span class="pill">↻ {{REFRESH}}s</span>
    </div>
  </header>
  <main>
    <div class="grid">
{{CARDS}}
    </div>
  </main>
  <footer class="page">Generated {{GENERATED}} · source of truth is the markdown vault; this view is derived from okf-postgres.</footer>
</body>
</html>
